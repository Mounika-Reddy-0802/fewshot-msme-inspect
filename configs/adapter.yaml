# Prototype memory + lightweight Tip-Adapter-style head.
# Only the adapter trains; the backbone stays frozen.

extends: prototype.yaml

experiment:
  name: adapter

model:
  kind: adapter

  adapter:
    init_from_memory: true  # cache keys start as the stored prototypes

    # alpha mixes the two branches and is a weight in [0, 1]:
    #   0.0 = cache only (ignore the prompts)
    #   1.0 = prompts only (ignore the cache)
    # This is NOT Tip-Adapter's unbounded cache-logit scale, which is also
    # called alpha and conventionally set to 1.0. Setting 1.0 here would
    # silently discard the support images entirely.
    alpha: 0.3

    beta: 5.5               # sharpness of exp(-beta * (1 - cosine similarity))
    top_k: 1                # cache entries aggregated per query patch
    trainable: false        # true = Tip-Adapter-F, fine-tuned keys (week 5)

  training:
    epochs: 20
    batch_size: 8
    lr: 0.001
    weight_decay: 0.01
    optimiser: adamw
    scheduler: cosine

dataset:
  shots: 5
