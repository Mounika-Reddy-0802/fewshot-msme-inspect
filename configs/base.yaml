# Shared defaults for every experiment.
# Experiment configs inherit with `extends: base.yaml` and only state what
# they change. ${data_root} / ${results_root} are resolved at load time from
# FEWSHOT_DATA_ROOT / FEWSHOT_RESULTS_ROOT, so no path here is machine specific.

experiment:
  name: base
  seed: 42
  output_dir: ${results_root}/runs  # (NOT YET READ -- see FEWSHOT_RESULTS_ROOT)

dataset:
  name: mvtec_ad
  root: ${data_root}/mvtec_ad
  category: bottle
  image_size: [224, 224]
  shots: 5                  # 0 | 1 | 5 | 10
  split_manifest: ${results_root}/manifests/splits  # (NOT YET READ -- splits are globbed)
  num_workers: 0

backbone:
  # The `-quickgelu` suffix is not cosmetic: the OpenAI CLIP weights were
  # trained with QuickGELU, and pairing them with a plain `ViT-B-16` silently
  # builds the model with the wrong activation. open_clip only warns about it.
  name: ViT-B-16-quickgelu  # ablations: ViT-B-32-quickgelu, ViT-L-14-quickgelu
  pretrained: openai

  # Member B's feature banks store the raw transformer width (768 for ViT-B/16),
  # not the 512-dim joint image-text projection. Matching her keeps one bank
  # format in the project. The cost is that patch features are no longer
  # comparable with text embeddings, so zero-shot prompting is unavailable --
  # acceptable, since the alpha sweep showed text never helps past 0 shots.
  project_patches: false
  precision: fp32           # fp32 | int8; int8 needs scripts/export_onnx.py first
  frozen: true

eval:
  metrics: [image_auroc, pixel_auroc, f1_max]
  batch_size: 16

profiling:
  enabled: true             # (NOT YET READ -- profiling is a separate script)
  device: cpu               # the whole benchmark is CPU-only by design
  warmup_iters: 5
  measure_iters: 20
  track: [latency_ms, peak_ram_mb, flops, params]  # (NOT YET READ -- all four are always measured)
