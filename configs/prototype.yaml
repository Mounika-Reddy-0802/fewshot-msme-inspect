# Frozen backbone + appendable prototype memory.
# Adding a new class appends prototypes; it never retrains what is already there.

extends: base.yaml

experiment:
  name: prototype

model:
  kind: prototype

  memory:
    append_only: true       # (NOT YET READ -- always true by construction; see test_memory.py)
    normalise: true         # (NOT YET READ -- always on)
    similarity: cosine
    reduction: mean         # (NOT YET READ -- week 5)
    patch_level: true       # (NOT YET READ -- always on)
    max_prototypes_per_class: null   # (NOT YET READ -- week 5, coreset pruning)

  scoring:
    top_k: 1                # neighbours averaged into the anomaly score
    temperature: 0.07
    scales: [1]             # window sizes; [1] is single-pass (src/model/windows.py)
    text_weight: 0.0        # image score = (1 - w) * memory + w * text prompts

dataset:
  shots: 5
